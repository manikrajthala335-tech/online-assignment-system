{% extends "base.html" %}
{% block title %}Create Account{% endblock %}

{% block body %}
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">Online Assignment System</div>
    <h1>Create Account</h1>
    <p class="subtitle">Register as a student or teacher.</p>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label>{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
        </div>
      {% endfor %}
      <button class="btn btn-primary" style="width:100%">Create Account</button>
    </form>
  </div>
</div>
{% endblock %}
